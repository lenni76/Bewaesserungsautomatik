type: vertical-stack
cards:
  - type: heading
    heading: Bewässerungsautomatik
    icon: mdi:sprinkler-variant
  - type: tile
    entity: switch.bewasserungsautomatik_bewasserung_freigeben
    name: Bewässerung freigeben · Aus = Winterpause
    icon: mdi:water-check
    tap_action:
      action: toggle
      confirmation:
        text: Bewässerungsfreigabe ändern? Aus stoppt auch einen laufenden manuellen Betrieb.
  - type: tile
    entity: sensor.bewasserungsautomatik_status
    name: Status
  - type: markdown
    content: >-
      **Entscheidung:** {{ states('sensor.bewasserungsautomatik_entscheidung') }}

      **Nächste Aktion:** {{ states('sensor.bewasserungsautomatik_nachste_aktion') }}

      {% if is_state('switch.bewasserungsautomatik_bewasserung_freigeben', 'off') %}
      ❄️ **Winterpause:** Das Ventil ist gesperrt. Wetterauswertung und Berechnung laufen weiter.
      {% endif %}
  - type: grid
    columns: 2
    square: false
    cards:
      - type: gauge
        entity: sensor.bewasserungsautomatik_bewasserungsbedarf
        name: Bedarf
        min: 0
        max: 100
      - type: gauge
        entity: sensor.bewasserungsautomatik_empfohlene_laufzeit
        name: Laufzeit
        min: 0
        max: 50
      - type: tile
        entity: sensor.bewasserungsautomatik_verbleibende_laufzeit
      - type: tile
        entity: time.bewasserungsautomatik_startzeit
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.bewasserungsautomatik_berechnungstemperatur
      - type: tile
        entity: sensor.bewasserungsautomatik_wirksamer_niederschlag
      - type: tile
        entity: sensor.bewasserungsautomatik_regen_nachste_12_stunden
      - type: tile
        entity: sensor.bewasserungsautomatik_trockene_tage
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        entity: button.bewasserungsautomatik_automatisch_jetzt_bewassern
        name: Jetzt bewässern
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.bewasserungsautomatik_automatisch_jetzt_bewassern
      - type: button
        entity: button.bewasserungsautomatik_wasser_manuell_offnen
        name: Wasser 4 Stunden
        tap_action:
          action: perform-action
          confirmation:
            text: Wasseranschluss für die eingestellte manuelle Laufzeit öffnen?
          perform_action: button.press
          target:
            entity_id: button.bewasserungsautomatik_wasser_manuell_offnen
      - type: button
        entity: button.bewasserungsautomatik_sofort_stoppen
        name: Sofort stoppen
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.bewasserungsautomatik_sofort_stoppen
      - type: tile
        entity: switch.bewasserungsautomatik_heute_aussetzen
  - type: entities
    title: Steuerung und Einstellungen
    entities:
      - switch.bewasserungsautomatik_automatik
      - time.bewasserungsautomatik_startzeit
      - switch.bewasserungsautomatik_sicherheitsabschaltung
      - switch.bewasserungsautomatik_benachrichtigungen
      - text.bewasserungsautomatik_benachrichtigungsdienst
      - switch.bewasserungsautomatik_expertenmodus
      - number.bewasserungsautomatik_basislaufzeit
      - number.bewasserungsautomatik_maximale_automatische_laufzeit
      - number.bewasserungsautomatik_manuelle_laufzeit
      - number.bewasserungsautomatik_regenwirkung
      - number.bewasserungsautomatik_gewichtung_vergangenheit
